# docker-compose.yml
# Docker configuration for HabitBuddy database

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: habitbuddy_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-habitbuddy_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-habitbuddy_pass_2024}
      POSTGRES_DB: ${DB_NAME:-habitbuddy_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - habitbuddy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-habitbuddy_user} -d ${DB_NAME:-habitbuddy_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - habitbuddy_net

volumes:
  habitbuddy_pgdata:
    driver: local

networks:
  habitbuddy_net:
    driver: bridge
